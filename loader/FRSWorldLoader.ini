; FRS World Loader -- puts what the FRS World Editor writes to <game>\models
; into the game: edited meshes and sections, replaced files. It needs no
; settings; this file is only for the tool below.

[Recorder]
; A memory recorder for working out what the game does (tools/memrec.py reads
; the recordings). Not needed to play. 1 = on.
Enabled=0
; Keys, as Windows virtual-key numbers (0x78 = 120 = F9, 0x77 = 119 = F8).
RecordKey=120
MarkKey=119
